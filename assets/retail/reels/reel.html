<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Cairo; src: url(Cairo.ttf); font-weight: 200 1000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #120E17; }
body { font-family: Cairo, 'Noto Color Emoji', sans-serif; color: #fff; }
#stage { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 0%, #3A1F5C 0%, #1B1324 55%, #120E17 100%); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
#b1 { width: 700px; height: 700px; background: #6D3BA0; }
#b2 { width: 560px; height: 560px; background: #C8492E; opacity: .35; }
#bar { position: absolute; top: 0; left: 0; height: 10px; background: linear-gradient(90deg, #C9A7F0, #FF9A7A); }
#brand { position: absolute; top: 56px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 18px;
  font-weight: 800; font-size: 40px; letter-spacing: .5px; }
.mark { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #8A55C4, #6D3BA0);
  display: grid; place-items: center; font-weight: 900; font-size: 40px; color: #fff; box-shadow: 0 8px 24px rgba(109,59,160,.5); }
.layer { position: absolute; inset: 0; }
.hook { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 70px; }
.hook .line { font-weight: 900; font-size: 112px; line-height: 1.18; text-shadow: 0 10px 40px rgba(0,0,0,.45); }
.hook .line.accent { color: #FF9A7A; }
.head { position: absolute; top: 190px; left: 60px; right: 60px; text-align: center; font-weight: 900; font-size: 76px; line-height: 1.2; }
.head small { display: block; font-weight: 600; font-size: 40px; color: #E4D6F5; margin-top: 10px; }
.device { position: absolute; left: 50%; overflow: hidden; background: #fff; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.08); }
.device.desk { width: 980px; height: 1060px; top: 520px; margin-left: -490px; border-radius: 36px; }
.device.desk .chrome { position: absolute; top: 0; left: 0; right: 0; height: 54px; background: #EFE9F5; display: flex; align-items: center; gap: 12px; padding: 0 24px; z-index: 2; }
.device.desk .chrome i { width: 18px; height: 18px; border-radius: 50%; background: #D4C7E2; display: block; }
.device.desk .shot { position: absolute; top: 54px; left: 0; right: 0; bottom: 0; overflow: hidden; }
.device.phone { width: 560px; height: 1150px; top: 480px; margin-left: -280px; border-radius: 70px; border: 16px solid #0B0910; }
.device.phone .shot { position: absolute; inset: 0; overflow: hidden; border-radius: 54px; }
.device.phone .notch { position: absolute; top: 14px; left: 50%; width: 150px; height: 36px; margin-left: -75px; background: #0B0910; border-radius: 20px; z-index: 3; }
.shot img { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.chips { position: absolute; top: 1660px; left: 50px; right: 50px; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
.chip { font-weight: 700; font-size: 36px; padding: 14px 30px; border-radius: 999px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.18); }
.tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 6px solid #FF9A7A; background: rgba(255,154,122,.25); z-index: 5; }
.end { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 30px; }
.end .big { width: 220px; height: 220px; border-radius: 60px; font-size: 140px; }
.end h1 { font-weight: 900; font-size: 110px; line-height: 1.1; }
.end p { font-weight: 600; font-size: 46px; color: #E4D6F5; }
.cta { margin-top: 40px; display: flex; align-items: center; gap: 22px; padding: 30px 56px; border-radius: 999px; background: #25D366; color: #08240F; font-weight: 900; font-size: 50px; box-shadow: 0 20px 60px rgba(37,211,102,.35); direction: ltr; }
.url { font-weight: 700; font-size: 40px; color: #FF9A7A; direction: ltr; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
  <div id="layers"></div>
  <div id="brand"><div class="mark">A</div><span id="brandName"></span></div>
  <div id="bar"></div>
</div>
<script>
const ease = t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
const inOut = t => t < 0 ? 0 : t > 1 ? 1 : t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const spring = t => { if (t <= 0) return 0; if (t >= 1) return 1; return 1 - Math.exp(-6 * t) * Math.cos(10 * t); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
let R, total, scenes = [];

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

window.setup = async (reel, shotBase) => {
  R = reel;
  document.documentElement.lang = R.lang;
  document.body.dir = R.lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('brandName').textContent = R.lang === 'ar' ? 'أرندس تك' : 'Arandas Tech';
  const L = document.getElementById('layers');
  let t = 0;
  const loads = [];
  for (const s of R.scenes) {
    const node = document.createElement('div'); node.className = 'layer'; L.appendChild(node);
    const sc = { ...s, start: t, node };
    if (s.type === 'hook') {
      node.classList.add('hook');
      sc.lines = s.lines.map((x, i) => { const n = el(`<div class="line${i === s.lines.length - 1 ? ' accent' : ''}"></div>`); n.textContent = x; node.appendChild(n); return n; });
    } else if (s.type === 'shot') {
      const head = el(`<div class="head"></div>`); head.textContent = s.title;
      if (s.sub) { const sm = document.createElement('small'); sm.textContent = s.sub; head.appendChild(sm); }
      node.appendChild(head); sc.head = head;
      const kind = s.phone ? 'phone' : 'desk';
      const dev = el(`<div class="device ${kind}">${kind === 'desk' ? '<div class="chrome"><i></i><i></i><i></i></div>' : '<div class="notch"></div>'}<div class="shot"><img></div></div>`);
      node.appendChild(dev); sc.dev = dev; sc.img = dev.querySelector('img');
      sc.img.src = shotBase + s.img;
      loads.push(new Promise(r => { sc.img.onload = r; sc.img.onerror = r; }));
      if (s.tap) { sc.tapEl = el('<div class="tap"></div>'); dev.querySelector('.shot').appendChild(sc.tapEl); }
      if (s.chips) { const c = el('<div class="chips"></div>'); s.chips.forEach(x => { const n = el('<div class="chip"></div>'); n.textContent = x; c.appendChild(n); }); node.appendChild(c); sc.chips = [...c.children]; }
    } else if (s.type === 'end') {
      node.classList.add('end');
      node.innerHTML = `<div class="mark big">A</div><h1></h1><p></p><div class="cta"><svg width="60" height="60" viewBox="0 0 24 24"><path fill="#08240F" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.7-.3-1.4-.7-2-1.3-.6-.5-1-1.1-1.4-1.8-.1-.2 0-.4.1-.5l.4-.4.2-.4v-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.6.6-.9 1.4-.9 2.2 0 .9.4 1.8.9 2.5 1 1.5 2.3 2.7 3.9 3.4.4.2.9.4 1.3.5.5.2 1 .2 1.5.1.6-.1 1.4-.6 1.6-1.1.2-.4.2-.9.1-1.1l-.6-.2z"/></svg><span>0791 568 798</span></div><div class="url">erp-house.vercel.app</div>`;
      node.querySelector('h1').textContent = s.title; node.querySelector('p').textContent = s.sub;
      sc.parts = [...node.children];
    }
    scenes.push(sc); t += s.d;
  }
  total = t;
  await Promise.all(loads);
  for (const sc of scenes) if (sc.img) {
    const W = sc.img.naturalWidth, H = sc.img.naturalHeight, box = sc.img.parentElement.getBoundingClientRect();
    sc.W = W; sc.H = H; sc.bw = box.width; sc.bh = box.height;
  }
  await document.fonts.ready;
  return total;
};

// Place the screenshot so the point (fx, fy) of it, as fractions, sits in the middle of the window, at zoom z
// (z = 1 means the image's width fills the window, or its height for a phone).
function place(sc, fx, fy, z) {
  const base = sc.phone ? sc.bh / sc.H : Math.max(sc.bw / sc.W, sc.bh / sc.H);
  const s = base * z, w = sc.W * s, h = sc.H * s;
  let x = sc.bw / 2 - fx * w, y = sc.bh / 2 - fy * h;
  x = clamp(x, sc.bw - w, 0); y = clamp(y, sc.bh - h, 0);
  sc.img.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  return { x, y, s };
}

window.render = (t) => {
  document.getElementById('bar').style.width = (100 * t / total) + '%';
  document.getElementById('b1').style.transform = `translate(${-200 + 160 * Math.sin(t * .35)}px, ${-150 + 120 * Math.cos(t * .27)}px)`;
  document.getElementById('b2').style.transform = `translate(${620 + 120 * Math.cos(t * .3)}px, ${1350 + 140 * Math.sin(t * .22)}px)`;
  const brand = document.getElementById('brand');
  const last = scenes[scenes.length - 1];
  brand.style.opacity = t > last.start ? 1 - ease((t - last.start) / .4) : 1;
  for (const sc of scenes) {
    const lt = t - sc.start, n = sc.node;
    const fadeIn = .35, fadeOut = .3;
    const vis = lt > -0.01 && lt < sc.d + (sc === last ? 99 : 0);
    n.style.display = vis ? 'block' : 'none';
    if (sc.type === 'hook') n.style.display = vis ? 'flex' : 'none';
    if (sc.type === 'end') n.style.display = vis ? 'flex' : 'none';
    if (!vis) continue;
    const out = sc === last ? 0 : ease((lt - (sc.d - fadeOut)) / fadeOut);
    n.style.opacity = 1 - out;
    if (sc.type === 'hook') {
      sc.lines.forEach((x, i) => {
        const p = spring((lt - .15 - i * .45) / 1.0);
        x.style.opacity = clamp((lt - .15 - i * .45) / .2, 0, 1);
        x.style.transform = `translateY(${(1 - p) * 80}px) scale(${.7 + .3 * p})`;
      });
      n.style.transform = `scale(${1 + .04 * lt / sc.d - .08 * out})`;
    } else if (sc.type === 'shot') {
      const hp = ease(lt / .5);
      sc.head.style.opacity = hp; sc.head.style.transform = `translateY(${(1 - hp) * -40}px)`;
      const dp = spring(lt / .9);
      const dir = R.lang === 'ar' ? -1 : 1;
      sc.dev.style.transform = `translateX(${(1 - dp) * 380 * dir - out * 300 * dir}px) rotate(${(1 - dp) * 4 * dir}deg)`;
      sc.dev.style.opacity = clamp(lt / .25, 0, 1);
      const [a, b] = sc.pan || [[.5, 0, 1], [.5, .2, 1.15]];
      const k = inOut((lt - .3) / (sc.d - .6));
      const P = place(sc, a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k);
      if (sc.tapEl) {
        const [tx, ty, tt] = sc.tap; const q = (lt - tt) / .6;
        sc.tapEl.style.left = (P.x + tx * sc.W * P.s) + 'px'; sc.tapEl.style.top = (P.y + ty * sc.H * P.s) + 'px';
        sc.tapEl.style.opacity = q < 0 ? 0 : q > 1 ? 0 : 1 - q;
        sc.tapEl.style.transform = `scale(${.4 + 1.1 * ease(q)})`;
      }
      if (sc.chips) sc.chips.forEach((c, i) => { const p = spring((lt - .5 - i * .18) / .8); c.style.opacity = clamp((lt - .5 - i * .18) / .2, 0, 1); c.style.transform = `translateY(${(1 - p) * 40}px)`; });
    } else if (sc.type === 'end') {
      sc.parts.forEach((x, i) => {
        const p = spring((lt - i * .18) / .9);
        x.style.opacity = clamp((lt - i * .18) / .25, 0, 1);
        x.style.transform = `translateY(${(1 - p) * 60}px) scale(${i === 3 ? 1 + .04 * Math.sin(Math.max(0, lt - 1.2) * 6) : 1})`;
      });
    }
  }
};
</script>
</body>
</html>
