name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']

defaults:
  run:
    working-directory: site

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # Includes the Arabic checks in test/l10n/translations_test.dart and the layout of every page in both languages.
      - run: flutter test --coverage
      - run: tool/check_coverage.sh 60
      - run: flutter build web --release --wasm
