<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zirr · Flutter apps for agencies</title>
  <meta name="description" content="Zirr is a Flutter and Supabase studio in Amman. A white-label Flutter team for agencies, and ready products for shops (Zirr Retail and Zirr POS), in Arabic and English.">
  <meta name="theme-color" content="#2B4C8C">

  <!-- Shown when a link is shared on WhatsApp, Facebook or LinkedIn. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zirr · Flutter apps for agencies">
  <meta property="og:description" content="A white-label Flutter team for agencies, and ready products for shops, in Arabic and English.">
  <!-- From the root, so a link to a deeper page (/products/retail) finds it too. -->
  <meta property="og:image" content="/assets/assets/images/zirr-retail.jpg">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zirr">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F7F5F0; }
    @media (prefers-color-scheme: dark) { body { background: #0D121C; } }
    /* While the site boots: the Zirr button presses itself in under an invisible thumb, and a line under it changes
       now and then, in the visitor's language. It fades out on Flutter's first frame. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; font-family: Rubik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .4s ease;
    }
    #boot .press { width: 56px; height: 56px; animation: press 1100ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes press { 0% { transform: scale(1); } 22% { transform: scale(.84); } 60%, 100% { transform: scale(1); } }
    #boot .line { font-size: 15px; color: #5A6272; min-height: 22px; transition: opacity .25s ease; }
    #boot .line.swap { opacity: 0; }
    @media (prefers-color-scheme: dark) { #boot .line { color: #A9B1C0; } }
    @media (prefers-reduced-motion: reduce) { #boot .press { animation: none; } #boot .line { transition: none; } }
    body.flutter-ready #boot { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- For search engines and visitors without JavaScript. -->
  <noscript>
    <h1>Zirr</h1>
    <p>A Flutter and Supabase studio in Amman, Jordan. A white-label Flutter team for agencies, and Zirr Retail: an online shop, back office and point of sale. Arabic and English.</p>
    <p><a href="https://wa.me/962791568798">WhatsApp</a></p>
  </noscript>
  <div id="boot" role="status" aria-label="Loading Zirr">
    <svg class="press" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="#2B4C8C"/>
      <circle cx="60" cy="60" r="43" fill="none" stroke="#F7F5F0" stroke-opacity=".25" stroke-width="3"/>
      <g fill="#F7F5F0"><rect x="38" y="38" width="19" height="19" rx="6"/><rect x="38" y="63" width="19" height="19" rx="6"/><rect x="63" y="63" width="19" height="19" rx="6"/></g>
      <rect x="63" y="38" width="19" height="19" rx="6" fill="#EE7B30"/>
    </svg>
    <div class="line" aria-hidden="true"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('flutter-ready');
      clearInterval(window.bootLines);
    });
    (function () {
      var arabic = /^ar/i.test(navigator.language || '');
      var lines = arabic
        ? ['لحظة، نخيط الأزرار…', 'نرتّب الصفحات…', 'نسخّن القهوة…']
        : ['Sewing on the buttons…', 'Lining up the pages…', 'Warming up the coffee…'];
      var el = document.querySelector('#boot .line');
      if (arabic) el.dir = 'rtl';
      var i = 0;
      el.textContent = lines[0];
      window.bootLines = setInterval(function () {
        el.classList.add('swap');
        setTimeout(function () { i = (i + 1) % lines.length; el.textContent = lines[i]; el.classList.remove('swap'); }, 250);
      }, 2200);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
