  <style>
    body { margin: 0; background: #F5F1EA; }
    @media (prefers-color-scheme: dark) { body { background: #101416; } }
    /* While the site boots: the Arandas Tech monogram presses itself in under an invisible thumb, and a line under it changes
       now and then, in the visitor's language. It fades out on Flutter's first frame. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; font-family: Rubik, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .4s ease;
    }
    #boot .press { width: 56px; height: 56px; animation: press 1100ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes press { 0% { transform: scale(1); } 22% { transform: scale(.84); } 60%, 100% { transform: scale(1); } }
    #boot .line { font-size: 15px; color: #5A6272; min-height: 22px; transition: opacity .25s ease; }
    #boot .line.swap { opacity: 0; }
    @media (prefers-color-scheme: dark) { #boot .line { color: #A9B1C0; } }
    @media (prefers-reduced-motion: reduce) { #boot .press { animation: none; } #boot .line { transition: none; } }
    body.flutter-ready #boot { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- For search engines and visitors without JavaScript. -->
  <noscript>
    <h1>Arandas Tech</h1>
    <p>A software company in Amman, Jordan. Flutter apps for businesses and agencies, and Zirr, our software for shops: Zirr Retail, Zirr POS, Zirr Boutique and Zirr Starter. Arabic and English.</p>

      <li><a href="/zirr/boutique">Zirr Boutique</a>: an online store for fashion brands</li>
    </ul>
    <p><a href="https://wa.me/962791568798">WhatsApp</a></p>
  </noscript>
  <div id="boot" role="status" aria-label="Loading Arandas Tech">
    <svg class="press" viewBox="0 0 120 120" aria-hidden="true">
      <rect x="4" y="4" width="112" height="112" rx="34" fill="#0E5E6F"/>
      <path d="M32 90 60 30 88 90" fill="none" stroke="#F5F1EA" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="52" y="63" width="16" height="16" rx="3" fill="#E8A33D"/>
    </svg>
    <div class="line" aria-hidden="true"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('flutter-ready');
      clearInterval(window.bootLines);
    });
    (function () {
      var arabic = /^ar/i.test(navigator.language || '');
      var lines = arabic
        ? ['لحظة، نشغّل المحرّكات…', 'نرتّب الصفحات…', 'نسخّن القهوة…']
        : ['Compiling the welcome…', 'Lining up the pages…', 'Warming up the coffee…'];
      var el = document.querySelector('#boot .line');
      if (arabic) el.dir = 'rtl';
      var i = 0;
      el.textContent = lines[0];
      window.bootLines = setInterval(function () {
        el.classList.add('swap');
        setTimeout(function () { i = (i + 1) % lines.length; el.textContent = lines[i]; el.classList.remove('swap'); }, 250);
      }, 2200);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
