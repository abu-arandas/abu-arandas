name: arandas_site
description: "The Zirr website: services for agencies, our products and case studies, in Arabic and English."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Material widgets, as a package since Flutter 3.50 deprecated package:flutter/material.dart.
  material_ui: ^1.11.0

  # Pinned exactly, as in zirr-starter: one maintainer, and 5.0 has been a release candidate since 2023.
  get: 4.7.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Rubik (SIL Open Font License), one font for Arabic and Latin, the brand's own.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
